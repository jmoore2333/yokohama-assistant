[package]
name = "yokohama-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# `cargo package` would bundle `assets/art/` — third-party, no license grant, see ASSETS.md.
publish = false

# M6.5a (R-6.5a.5): the table layer builds for `wasm32-unknown-unknown` without
# its server half. `server` is on by default and is the ONLY thing that pulls
# axum, tokio and tokio-stream in — cargo features are additive and tokio's
# `time` builds for the target only to panic, so the DEPENDENCY is what is
# gated, not a call inside it.
[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:tokio-stream"]

[dependencies]
# The engine, and the CLI's library half. `yokohama-cli` is a lib as well as a
# bin, and this crate consumes exactly the parts of it that were never about a
# terminal: `session` (atomic apply/undo/save with the legal-list gate and the
# invariant guard), `screen_model` (the typed frame, which its own module doc
# calls "the seam a later API or GUI layer can consume without a terminal"),
# `describe` (the wording layer), `repl` (the state machine and its option
# rows), `bot`, and three items from `render`.
#
# THE `render` DEPENDENCY IS REAL AND WORTH NAMING, because an earlier version
# of this comment denied it. `render::DisplayRow` is the shape `option_rows`
# returns, and `render::end_trigger_line` is the one rendered STRING this crate
# serves — deliberately, because the strip's 8 and 4 thresholds are bare
# literals in the engine with no name to import, so composing it here would
# write two rules constants into a web layer. Nothing in `*_render.rs`,
# `screen.rs` or `style.rs` is reachable, which is the fence that matters: no
# ANSI, no column widths, no box drawing.
#
# M3 added three more, and this paragraph is the fence's written half so it
# moves with them: `suggest` and `why` (the two search surfaces — `why` was
# `pub(crate)` and was widened for exactly this consumer, and its own doc says
# so), and `card_prompt`, for `parse_filter` alone. The rule that governs all
# three is the same one above: they are the parts of the CLI that were never
# about a terminal. `why::account_parts` is the honesty gate and is REACHED
# rather than reimplemented; `parse_filter` is the one card-entry grammar in
# this project and the web does not get a second one.
#
# What is still NOT consumed is the line that matters, and it is the one
# unchanged: nothing in `*_render.rs`, `screen.rs` or `style.rs`. The engine
# types those surfaces return have no `Serialize`, so `explain.rs` and
# `outcome.rs` mirror them here — never by deriving in `yokohama-core`.
yokohama-core = { path = "../yokohama-core" }
yokohama-cli = { path = "../yokohama-cli" }
serde.workspace = true
serde_json.workspace = true
# M6.5a (R-6.5a.2): the layer's refusal type is typed on the `http` crate directly —
# the same type axum re-exports — so the layer compiles without axum.
http = "1"

# THE dependency decision for this crate, owner-ruled 2026-08-30. The workspace
# had no async runtime and no HTTP framework: `yokohama-bridge` hand-rolls
# HTTP/1.1 over `std` and says in its own Cargo.toml that no third-party
# dependency enters it. This crate deviates deliberately, and the reason is
# specific rather than stylistic:
#
#   `crates/yokohama-bridge/src/http.rs:119-123` RECORDS its own
#   request-smuggling shapes -- a duplicate `Content-Length` is last-wins and
#   `Transfer-Encoding` is unimplemented -- and states they are harmless ONLY
#   because nothing sits in front of that listener. This server is designed to
#   sit behind a Cloudflare Worker and a Modal or Container proxy. Reusing that
#   parser would turn documented non-issues into real bugs.
#
# It also buys keep-alive (the hand-rolled server is `Connection: close`
# unconditional, so every card image would pay a fresh TCP connection) and a
# path to SSE if a bot decision ever grows slow enough to want streaming.
#
# The blast radius is one leaf crate: `yokohama-core` gains nothing, and no
# other crate in the workspace depends on this one.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"], optional = true }

# M6.2 (owner-ruled 2026-09-15, spec R-2.8): the table password. The workspace
# has no hash crate — `fnv1a_64` in yokohama-core is a digest, not a password
# hash — and the threat is a shared game password behind Cloudflare Access, so
# a salted SHA-256 is the whole of it: no argon2, no constant-time crate (the
# compare is a fold of XORs in table.rs).
sha2 = "0.10"

# M6.3 (owner-ruled 2026-09-15, spec R-3.11): the change signal. `tokio::sync::watch`
# is the in-process channel one bump per table rides on (it coalesces, which is the
# property a "something changed" signal wants), and `tokio-stream`'s `sync` feature
# turns a receiver into the `Stream` axum's SSE response consumes. tokio's `time`
# joins the list in the same cycle, for the SSE heartbeat, the `?wait` arm's
# `timeout` and the stream cells' deadlined reads (controller ruling R-2.1).
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[dev-dependencies]
# Route tests drive the router through `ServiceExt::oneshot` -- no socket, no
# port, no runtime teardown to get wrong. A test that binds a real port is a
# test that flakes on a busy machine and cannot run in parallel with itself.
tower = { version = "0.5", features = ["util"] }

# M6.5a (R-6.5a.7): the ONE blocker between this crate and wasm32-unknown-unknown
# is getrandom's `js` feature, reached through rand from core's OsRng. Enabling it
# here unifies onto core's dependency and leaves core's manifest byte-identical.
# Version-pinned: getrandom 0.3 renames the feature and needs a RUSTFLAGS cfg.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# The server binary exists only with its feature; `cargo check --no-default-features`
# skips it rather than failing on a `main` with no runtime.
[[bin]]
name = "yokohama-web"
path = "src/main.rs"
required-features = ["server"]
