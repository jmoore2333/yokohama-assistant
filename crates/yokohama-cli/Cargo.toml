[package]
name = "yokohama-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
yokohama-core = { path = "../yokohama-core" }
# Phase-3.5b H1: the BGA importer reads relay capture files through the
# bridge's `feed` module (parse + dedupe + supersession collapse). Workspace
# crate, std + serde_json only -- no third-party addition rides this line.
yokohama-bridge = { path = "../yokohama-bridge" }
serde.workspace = true
serde_json.workspace = true
# Promoted from dev-dependencies at Phase 3.2 Task 12: the sim-mode bot seats
# draw their per-decision moves through `RolloutPolicy::pick`, which takes an
# `impl rand::Rng`. Both crates were already workspace dependencies used by the
# CLI's tests -- no new crate enters the tree.
rand.workspace = true
rand_chacha.workspace = true
# The 2026-10-09 derivation of `suggest::stream_seed` (security S1a, finding A1,
# R-SEC3): a one-way digest in place of a SplitMix64 fold. The same crate and
# version `yokohama-web` already builds, on wasm32 too (its table password).
sha2 = "0.10"
# Phase-3.5a T9, spec §0.9: THE one new dependency, and it is the CLI crate's
# alone -- core/oracle/difftest/gen-data keep the dependency lists they had.
# MIT; this workspace is Apache-2.0 (see `LICENSE`), and MIT is compatible with
# it in this direction. See `src/input.rs` for the seam.
#
# `default-features = false` is load-bearing twice over, not tidiness:
#   * it drops `with-file-history`, and THAT is what makes rustyline's
#     `DefaultHistory` the in-memory `MemHistory` rather than the file-backed
#     one -- the "history never touches disk" rule of T9 becomes a fact about
#     which type exists rather than a discipline about which method we call
#     (`input::history_is_in_memory_by_construction` fails to COMPILE if the
#     feature comes back);
#   * it drops `custom-bindings` (and `with-dirs`), neither of which this
#     driver uses -- see `input.rs` on why single-KEYPRESS toggles are not
#     what this editor buys cheaply.
#
# `buffer-redux` is NOT decoration and NOT optional for this driver (T9 review,
# MUST-1). rustyline reads the tty through a buffered reader that it hands back
# at the end of every `readline` call; WITHOUT this feature the handback --
# `RawReader::unbuffer` -- is compiled as `None`, so every byte that arrived
# while the previous line was being processed is DROPPED with the buffer. That
# is type-ahead, and this driver invites it: the wizard asks a dozen questions
# in a row and the whole of it is meant to script in one write (see
# `wizard::the_whole_live_wizard_still_scripts_in_a_single_write_at_3p` and the
# Forge recipe in docs/forge-cli-testing.md). With the feature on, the leftover
# bytes carry into the next call and a typist -- or a paste, or a Forge write --
# who runs ahead of the prompt is answered rather than ignored. It adds ONE
# crate, buffer-redux 1.1.0 (MIT OR Apache-2.0), unix-only.
# `input::the_editor_arm_keeps_its_read_buffer_between_lines` pins the
# declaration; the BEHAVIOUR is terminal-only and is verified in a PTY.
rustyline = { version = "18.0.1", default-features = false, features = ["buffer-redux"] }
