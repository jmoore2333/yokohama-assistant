[workspace]
resolver = "2"
members = [
    "crates/yokohama-core",
    "crates/gen-data",
    "crates/yokohama-cli",
    "crates/yokohama-oracle",
    "crates/yokohama-difftest",
    "crates/yokohama-bridge",
    "crates/yokohama-web",
    "crates/yokohama-wasm",
    "crates/yokohama-worker",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Jeremy Moore"]

# The two hosts' modules, and NOTHING else: the browser's (`yokohama-wasm`,
# M6.5b2, R-6.5b2.15) and, since M6.5c, the Durable Objects'
# (`yokohama-worker`, spec §2.2), which the per-edit gate builds under this
# same profile.
#
# A phone compiles the BROWSER module on every cold start, and the whole
# release is precached, so bytes there are paid by every visitor on every
# version.
#
# **The figures in this paragraph are the BROWSER module's**, read at
# `c39da5a1` (the M6.5c2 cycle E close, its Task 10.B, 2026-09-30) under `wasm-opt` 133,
# `wasm-bindgen`'s output: the release module reads **1,216,429 B** under this
# profile once `npm run build:wasm` runs `wasm-opt -Oz` over it, from
# 1,844,514 B before `wasm-opt` (cycle D's close read 1,215,865 B from
# 1,843,940 B at `4212f6a0`; the +564 B is cycle E's layer code). Its
# `gzip -9` reading at that close: **472,169 B** (M6.5b2's 456,048 B was the
# last one before it, at a smaller module). The plain-`release` size and the
# cost of a whole bot turn (M6.5b2's 2,843,070 B, and 28.6 -> 35.2 ms) were
# not re-read.
# **A figure here is a READING, not a constant**: two builds of one source
# differ by about a hundred bytes. **This is the ONE place the figures are
# measured and every other document cites it** — `web/scripts/wasm-opt.mjs`,
# `web/src/precache.ts`, `deploy/RUNBOOK.md` §1 and `CLAUDE.md` all carried
# M6.5b2's Task 5 readings after its Task 8 grew the module, which is that
# cycle's whole-branch review's false sentence 6.
#
# **The WORKER module's figures** (`yokohama-worker`, M6.5c2, spec §2.7),
# read at `c39da5a1` (the cycle E close, its Task 10.B, 2026-09-30; this
# workstation, Darwin arm64, macOS 27.0), off `worker/gen/yokohama_worker_bg.wasm` after `cd worker && npm
# run build:module` (this profile, then `wasm-opt -Oz`), by `node
# worker/scripts/module-figures.mjs worker/gen/yokohama_worker_bg.wasm`:
# **1,276,830 B** (1,931,148 B before `wasm-opt`; cycle D's close read
# 1,275,056 B from 1,928,529 B), and 499,614 B gzipped at level 9 (Node's
# `zlib`, whose header names no file; the `gzip -9` command's names this one,
# 24 B more). Its linear memory starts at 18 pages (1,152 KiB), 123,748 B of
# them the module's data, copied in from its 172 data segments (the data
# SECTION is 125,164 B encoded). A figure here is a READING, not a constant. Every instance pays that memory — a table object's own,
# and the second it builds for one house copy (`copyOf`,
# `worker/src/table.ts`). **This is the ONE place those figures are
# measured**: `copyOf`'s doc and `worker/README.md` §6.3 cite it, as the
# browser module's figures above are cited. Re-measure here, never there.
#
# **It is its own profile rather than a `[profile.release]` edit** because
# nothing selects it without `--profile release-wasm`: the fifteen-gate release
# roster, `cargo build --release`, the server binary and the Docker image's
# `yokohama-web` all build exactly what they built before this section existed.
# A repo-wide `opt-level = "z"` would have quietly re-timed every gate wall and
# every arena figure recorded against the old one.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
