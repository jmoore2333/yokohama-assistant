[workspace]
resolver = "2"
members = [
    "crates/yokohama-core",
    "crates/gen-data",
    "crates/yokohama-cli",
    "crates/yokohama-oracle",
    "crates/yokohama-difftest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jeremy Moore"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
