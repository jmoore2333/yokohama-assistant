# Yokohama Technology Cards
# verified: 2026-07-17 — three-way (sprites x rulebook x physical), see docs/plans/2026-07-16-card-verification/
#
# Source sprite sheet: tech_cards_8x4.jpg in the Tabletop Simulator upload's organized sheets (not in this tree — docs/tools/tts-extraction/; 8 cols x 4 rows: 30 cards + 2 backs)
#
# The physical deck has 30 cards (rulebook: "30 Technology cards"). This file lists the 20 unique
# titles; `copies` gives the number of physical cards of that title (10 titles x2 + 10 titles x1 = 30).
# The engine expands entries by `copies` when building the deck.
# positions = sprite-sheet cells "row,col", 1-based from top-left, one per copy (traceability only).
# Duplicate copies match their first printing in cost, country, and effect text (verified per cell).
#
# Country codes: US=United States of America, DE=Germany, NL=Netherlands, FR=France, GB=Great Britain
# industry_cost = the number in the gear at the card's top-left.
# Effect codes match the TechEffect enum in types/cards.rs:
#   LanguageSchool, Telegram, Telephone, Newspaper, Exposition, Ball,
#   Gaslight, Station, University, LetterPressPrinting, PostalSystem,
#   Winery, ElectricalLight, MiningTechnology, SpinningMill (card name "Textile Mill"),
#   PatentSystem, Stagecoach, Tram, Brickyard, SystemOfStock (card name "Stock Market")

tech_cards:
  - id: "tech_language_school"
    positions: ["1,1", "3,5"]
    copies: 2
    name: "Language School"
    effect: "LanguageSchool"
    industry_cost: 3
    country: "US"
    description: "When you fulfill an Order: gain 1 Yen"

  - id: "tech_telegram"
    positions: ["1,2", "3,6"]
    copies: 2
    name: "Telegram"
    effect: "Telegram"
    industry_cost: 6
