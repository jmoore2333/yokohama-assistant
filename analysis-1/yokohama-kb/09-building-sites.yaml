# Yokohama Building Site Cards
# Transcribed from: tts-assets/organized/cards/building_site_cards_5x5.jpg
# Grid: 5 columns x 5 rows = 25 positions (24 cards + 1 back)
#
# Each card has:
#   - 4 shophouse slots (2x2 grid at top) with VP values
#   - 1 trading house slot (bottom) with VP value
#   - Optional resource bonuses on shophouse or trading house slots
#
# Slot layout on each card:
#   [slot1] [slot2]   (top-left, top-right)
#   [slot3] [slot4]   (bottom-left, bottom-right)
#   [trading_house]   (bottom large area)
#
# Bonus icons: fish, silk, tea, copper, any_resource (multi-colored), import, yen
#
# VERIFICATION: Check each card against sprite sheet position (row, col from top-left)

building_sites:
