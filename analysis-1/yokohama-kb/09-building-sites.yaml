# Yokohama Building Site Cards
# verified: 2026-07-17 — three-way (sprites x rulebook x physical), see docs/plans/2026-07-16-card-verification/
#
# Source sprite sheet: tts-assets/organized/cards/building_site_cards_5x5.jpg (5 cols x 5 rows: 24 cards + 1 back)
#
# Card anatomy (rulebook p.2: "4 Building Sites for Shophouses, and corresponding rewards" +
# 1 trading-house site): four POSITIONAL shophouse spaces in a 2x2 grid, keyed TL/TR/ML/MR
# (top-left, top-right, middle-left, middle-right as printed on the portrait card), plus one
# trading-house space (bottom) whose reward is always plain VP (trading_house_vp).
# On every card in this set: TL is { vp: 1 } and ML is blank ({}).
# The key order is POSITION ONLY — no build-order semantics are encoded or implied.
#
# A space's reward is a self-describing map; {} = blank space (no printed reward).
# Reward keys: vp, yen, seafood, tea, silk, copper, any_good (4-color wild square),
#   shophouse_build (house icon with red arrow), assistants (yellow assistant + arrow onto pad).
#   Combined rewards are one map, e.g. { vp: 2, yen: 1 }.
# position = sprite-sheet cell "row,col", 1-based from top-left (traceability only).

