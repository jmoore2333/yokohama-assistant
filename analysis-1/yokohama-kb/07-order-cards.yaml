#
# Source sprite sheet: order_cards_8x5.jpg in the Tabletop Simulator upload's organized sheets (not in this tree — docs/tools/tts-extraction/; 8 cols x 5 rows: 36 cards + 4 backs)
#
# id = the number printed in the card's bottom-right corner (1-36; each appears exactly once).
#      This is the canonical OrderCardId — adjudicated 2026-07-17: country+requirements does NOT
#      uniquely identify a card (GB #10 and GB #32 share 1 seafood + 1 tea + 2 copper).
# position = sprite-sheet cell "row,col", 1-based from top-left (traceability only).
#
# Countries: US=United States of America, DE=Germany, NL=Netherlands, FR=France, GB=Great Britain
# Requirement keys (trade goods, rulebook names): seafood (blue fish), tea (green leaf),
#   silk (raw silk, white bale), copper (red ingot). Absent key = 0.
# Reward keys: vp (blue star), yen (silver coin), imports (IMPORTS crate),
#   shophouse_build (house icon with red up-arrow), assistants (yellow assistant + arrow onto pad).

