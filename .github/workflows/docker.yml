name: docker

# **The self-host image, built when one of its WEB-LANE inputs changes**
# (M6.5c2, R-6.5c2.14; spec §2.9 as revision 2.7 amends it).
# `deploy/Dockerfile` builds the server and the browser client from a
# checkout: the image a self-hoster runs. The NAS is deployed from
# `deploy/Dockerfile.runtime` instead (deploy/RUNBOOK.md §1–§3), so nothing
# else would notice this image breaking — M6.5c added a workspace member, and
# whether the image still built went unread until M6.5c2 built it (R3's E-3).
# The image is smoke-run under no door, under `cf-access` and under `open`
# (`deploy/smoke-image.sh`), then built again with a project link, and the
# link is checked to reach that build's bundle and no other.
#
# **The trigger is NARROWED to the web lane** (the owner's ruling
# R-6.5c2.24, "CI stays lean"; cycle C's R-C9): a pull request, or a push to
# master, that changes one of the paths below, and a dispatch by hand. The
# image COPYs `rust-toolchain.toml`, `Cargo.toml`, `Cargo.lock`, ALL of
# `crates/`, `web/package*.json` and `web/`, and `cargo build -p
# yokohama-web` compiles the engine, the CLI and the BGA bridge with the
# layer — yet a change under `crates/yokohama-core`, `crates/yokohama-cli` or
# `crates/yokohama-bridge` alone, or under any member of `crates/` but the
# layer and the browser host, does NOT run this workflow, deliberately: an
# AI-lane push pays no cold image build. A core change that breaks the image
# is caught at the next web-lane pull request, or by dispatching this
# workflow by hand. `Cargo.lock` stays in the list, because a dependency
# change moves it. From `deploy/`, the Dockerfile and its dockerignore are
# the image's inputs and the smoke script is this workflow's; the RUNBOOK is
# neither. GitHub filters paths per WORKFLOW, which is why this is a workflow
# and not a job of `test.yml`. The repository is private, so its minutes are
# counted.
#
# **The cache holds the toolchain, not the Rust build.** `cache-to: type=gha`
# stores image layers. The Dockerfile's `--mount=type=cache` mounts
# (`/usr/local/cargo/registry`, `/src/target`) are NOT carried, so every run
# pays a cold `cargo build` of the server and the module. What does come back:
# the layers above the source `COPY` (the toolchain, binaryen,
# `wasm-bindgen-cli`) and the client's `npm ci`. The first runs' walls are
# recorded in the M6.5c2 close; if a cold build reads over fifteen minutes the
# trigger drops to master pushes and dispatch (R-C9), and a cache-mount export
# step is the option only if the walls warrant it.
on:
  push:
    branches: [master]
    paths:
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.dockerignore"
      - "deploy/smoke-image.sh"
      - "crates/yokohama-web/**"
      - "crates/yokohama-wasm/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.dockerignore"
      - "deploy/smoke-image.sh"
      - "crates/yokohama-web/**"
      - "crates/yokohama-wasm/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same ref makes an older build's minutes pointless.
concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # The PATH context (`context: .`), not the action's default Git context.
      # The Git context re-fetches the commit inside BuildKit and ignores the
      # checkout, and this build must read the checkout's
      # `deploy/Dockerfile.dockerignore`.
      - name: Build the image — no project link
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          tags: yokohama-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=yokohama-web
          cache-to: type=gha,scope=yokohama-web,mode=max
      - name: Smoke-run it under no door, cf-access and open
        run: bash deploy/smoke-image.sh yokohama-web:ci
      # The same builder holds the first build's layers, so only the client
      # stage's `build:client` and what follows it re-run: the ARG sits
      # directly above that step.
      - name: Build it again WITH a project link
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          tags: yokohama-web:ci-link
          load: true
          push: false
          build-args: |
            YOKOHAMA_PROJECT_URL=https://example.test/yokohama-ci
          cache-from: type=gha,scope=yokohama-web
      - name: The link reached the bundle, and only the build that asked for it
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh yokohama-web:ci-link -c \
            'grep -l "example.test/yokohama-ci" /srv/web/dist/assets/*.js'
          if docker run --rm --entrypoint sh yokohama-web:ci -c \
              'grep -l "example.test/yokohama-ci" /srv/web/dist/assets/*.js'; then
            echo "::error::the image built without a link carries one"
            exit 1
          fi
