name: docker

# **The self-host image, built by hand, on dispatch**
# (M6.5c2, R-6.5c2.14; spec §2.9 as revision 2.7 amends it).
# `deploy/Dockerfile` builds the server and the browser client from a
# checkout: the image a self-hoster runs. The NAS is deployed from
# `deploy/Dockerfile.runtime` instead (deploy/RUNBOOK.md §1–§3), so nothing
# else would notice this image breaking — M6.5c added a workspace member, and
# whether the image still built went unread until M6.5c2 built it (R3's E-3).
# The image is smoke-run under no door, under `cf-access` and under `open`
# (`deploy/smoke-image.sh`), then built again with a project link, and the
# link is checked to reach that build's bundle and no other.
#
# **The trigger is DISPATCH ONLY** (R-6.5c2.31): run it by hand with
# `gh workflow run docker.yml --ref <branch>` before a release or after a
# change to the image's inputs (`deploy/Dockerfile`, `deploy/smoke-image.sh`,
# `crates/`, `web/`, the lockfile, the toolchain file). R-C9's fifteen-minute
# rule is retired with the trigger, since nothing runs this on a push or pull
# request any more. GitHub side: disabled since 2026-09-28 and it stays so
# through E's merge.
#
# **Which runs are COLD, and which are WARM.** `cache-to: type=gha,…,mode=max`
# exports every layer of every stage, the server stage's build step among
# them: its `--mount=type=cache` mounts (`/usr/local/cargo/registry`,
# `/src/target`) stay out of the layer, and the layer is still exported. So a
# run pays a cold `cargo build` of the server and the module whenever that
# step's layer cannot come back from the cache. That happens when one of the
# server stage's inputs differs from the cached run's: `rust-toolchain.toml`,
# `Cargo.toml`, `Cargo.lock` or anything under `crates/` (a change under
# `crates/yokohama-web/**` or `crates/yokohama-wasm/**`, a core change
# since the cached run, or a dockerignore edit that changes
# what reaches them). It happens when one of the server stage's instructions
# in `deploy/Dockerfile` is edited, and when the floating base tag
# `rust:1-slim-trixie` has been republished since the cached run. And it
# happens when the run can restore no cache at all: the first run, one after
# GitHub evicts the cache, or one whose ref cannot read the cache an earlier
# run wrote (a run restores its own ref's caches and the default branch's, so
# a branch dispatched for the first time finds no other branch's). Every other
# run is WARM, typically one whose changes since the cached run touch only
# `web/**`, the smoke script, this file or the Dockerfile's client or runtime
# stage: it restores the server stage and pays the
# client stage alone.
# A cold run caused by a changed input still restores the layers above that
# input's step (the toolchain, binaryen and `wasm-bindgen-cli` sit above the
# source `COPY`); a run with no cache, or after the base is republished,
# restores none of them.
#
# **Reading a cold wall.** A run whose log shows the server build layer,
# `[server 10/10]`, executing rather than `CACHED` is cold, and a cold wall is
# the one worth reading.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same ref makes an older build's minutes pointless.
concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      # The PATH context (`context: .`), not the action's default Git context.
      # The Git context re-fetches the commit inside BuildKit and ignores the
      # checkout, and this build must read the checkout's
      # `deploy/Dockerfile.dockerignore`.
      - name: Build the image — no project link
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          tags: yokohama-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=yokohama-web
          cache-to: type=gha,scope=yokohama-web,mode=max
      - name: Smoke-run it under no door, cf-access and open
        run: bash deploy/smoke-image.sh yokohama-web:ci
      # The same builder holds the first build's layers, so only the client
      # stage's `build:client` and what follows it re-run: the ARG sits
      # directly above that step.
      - name: Build it again WITH a project link
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          tags: yokohama-web:ci-link
          load: true
          push: false
          build-args: |
            YOKOHAMA_PROJECT_URL=https://example.test/yokohama-ci
            YOKOHAMA_SITE_BLURB=A blurb for the CI build. It has two sentences.
            YOKOHAMA_SITE_NOTICE=A notice for the CI build
          cache-from: type=gha,scope=yokohama-web
      # The negative arm wants grep's exit 1 EXACTLY (it ran, and found no
      # match): 0 is a link where none was asked for, and anything else — grep's
      # 2 for a missing path, 125 or 127 from docker — is a check that did not
      # run, which must not read as a pass.
      - name: The link reached the bundle, and only the build that asked for it
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh yokohama-web:ci-link -c \
            'grep -l "example.test/yokohama-ci" /srv/web/dist/assets/*.js'
          docker run --rm --entrypoint sh yokohama-web:ci-link -c \
            'grep -l "A blurb for the CI build" /srv/web/dist/assets/*.js'
          docker run --rm --entrypoint sh yokohama-web:ci-link -c \
            'grep -l "A notice for the CI build" /srv/web/dist/assets/*.js'
          set +e
          docker run --rm --entrypoint sh yokohama-web:ci -c \
            'grep -l "example.test/yokohama-ci" /srv/web/dist/assets/*.js'
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::the image built without a link carries one"
            exit 1
          elif [ "$code" -ne 1 ]; then
            echo "::error::the no-link check did not run: exit $code, where grep's 1 (no match) was wanted"
            exit 1
          fi
