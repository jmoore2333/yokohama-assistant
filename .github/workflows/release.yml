name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The three "Test the CLI" steps below run `cargo test -p yokohama-cli`, which
  # includes ten pins backed by the owner's gitignored BGA capture
  # (`bridge-captures/895724349.ndjson`). Absence of that capture is a LOUD
  # panic by default — deliberately, so a corpus-less run cannot report those
  # pins as `ok` while asserting nothing (3.5b six-lens F6). A release runner
  # never has the capture, so without this the whole release build would fail on
  # all three OSes at the next tag. This is the documented opt-out, and it only
  # turns ABSENCE into a quiet skip: where the capture IS present the pins still
  # run and still assert.
  YOKOHAMA_BGA_CORPUS_OPTIONAL: "1"

jobs:
  ubuntu:
    name: Ubuntu x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # `rust-toolchain.toml` has pinned the compiler at an exact version since
      # f9ca6d4 (2026-08-11, `stable` -> `1.97.1`), so every cargo invocation
      # below runs under THAT toolchain -- not the `stable` the action above
      # just installed. The action's `targets:` therefore attaches the musl std
      # to the wrong toolchain and the cross build dies with
      # `error[E0463]: can't find crate for \`core\``. Attaching the target here,
      # inside the checkout, makes rustup resolve the pin itself -- so the
      # version stays single-sourced in rust-toolchain.toml and is never
      # restated in this file, where it would drift.
      - name: Attach the musl target to the pinned toolchain
        run: rustup target add x86_64-unknown-linux-musl
      - name: Install static-linking toolchain
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test the CLI
        run: cargo test --locked -p yokohama-cli --target x86_64-unknown-linux-musl
      - name: Run the full-game release smoke test
        run: cargo test --locked --release -p yokohama-cli --target x86_64-unknown-linux-musl --test piped_dogfood -- --ignored
      - name: Build a static Ubuntu binary
        run: cargo build --locked --release -p yokohama-cli --target x86_64-unknown-linux-musl
      - name: Package the Ubuntu release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="yokohama-cli-${RELEASE_TAG}-ubuntu-x86_64"
          mkdir -p "dist/${package}"
          install -m 0755 \
            target/x86_64-unknown-linux-musl/release/yokohama-cli \
            "dist/${package}/yokohama-cli"
          install -m 0644 README.md "dist/${package}/README.md"
          install -m 0644 docs/cli-guide.html "dist/${package}/CLI-GUIDE.html"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          file "dist/${package}/yokohama-cli"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-release
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    env:
      RUSTFLAGS: -C target-cpu=native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Test the CLI
        run: cargo test --locked -p yokohama-cli --target aarch64-apple-darwin
      - name: Build for Apple Silicon
        run: cargo build --locked --release -p yokohama-cli --target aarch64-apple-darwin
      - name: Package the Apple Silicon release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="yokohama-cli-${RELEASE_TAG}-macos-apple-silicon"
          mkdir -p "dist/${package}"
          install -m 0755 \
            target/aarch64-apple-darwin/release/yokohama-cli \
            "dist/${package}/yokohama-cli"
          codesign --force --sign - "dist/${package}/yokohama-cli"
          install -m 0644 README.md "dist/${package}/README.md"
          install -m 0644 docs/cli-guide.html "dist/${package}/CLI-GUIDE.html"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          file "dist/${package}/yokohama-cli"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      # The runner's git ships autocrlf-enabled; a CRLF checkout would break
      # the byte-identical golden comparisons (guide_sync, piped-plain) that
      # the CLI test suite pins. Force LF before checkout.
      - name: Force LF checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test the CLI
        run: cargo test --locked -p yokohama-cli --target x86_64-pc-windows-msvc
      - name: Build for Windows x86_64
        run: cargo build --locked --release -p yokohama-cli --target x86_64-pc-windows-msvc
      - name: Package the Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $package = "yokohama-cli-$env:RELEASE_TAG-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/yokohama-cli.exe "dist/$package/yokohama-cli.exe"
          Copy-Item README.md "dist/$package/README.md"
          Copy-Item docs/cli-guide.html "dist/$package/CLI-GUIDE.html"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [ubuntu, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 3
          install -m 0644 docs/cli-guide.html dist/yokohama-cli-guide.html
          cd dist
          sha256sum ./*.tar.gz ./*.zip ./yokohama-cli-guide.html > SHA256SUMS
      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "Yokohama CLI ${RELEASE_TAG}" \
              --generate-notes \
              "${prerelease[@]}"
          fi
