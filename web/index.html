<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yokohama</title>
    <!-- **A declared icon, so the browser stops asking for one it will not get**
         (live review, M-4). With no `rel="icon"` a browser requests
         `/favicon.ico` on every first load and this server answers 404 — the
         ONLY console error of the whole three-browser walk, one per screen. It
         is not a headless finding: headless Chromium never asks, which is why
         M6.3's review read "zero console errors" and the first HEADED one did
         not. An empty `data:` URL is the whole fix: it is a valid icon request
         the browser answers itself, off the network, with nothing to serve and
         nothing to commit. -->
    <link rel="icon" href="data:," />
    <!-- **The typefaces are in-house since M6.5b2** (R-6.5b2.18). Two
         `preconnect`s and a render-blocking stylesheet from
         `fonts.googleapis.com` stood here; both families are OFL and are now
         served from this origin, declared by `@font-face` at the head of
         `src/styles.css`. Nothing else could make the release self-contained:
         a service worker cannot precache a third party's origin, so an offline
         launch lost both typefaces and one round trip to a second host was on
         the critical path of every online one. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
