<?xml version="1.0" encoding="UTF-8"?>
<!-- Yokohama's app mark, drawn in-repo (M6.5b2, R-6.5b2.9 / spec §2.4).

     ORIGINAL, and never a crop of the card art: `ASSETS.md` carves the card
     sheets out as carrying no grant of any kind, and an app icon is the most
     distributed image a product has.

     The mark is the board itself — the staggered pyramid of area tiles, rows of
     four, three and two, brick-offset by centring, which is how `board_gen`
     lays out a two-player board. The lit tile is the middle row's centre: one
     place on the board, which is what a turn comes down to. The colours are the
     stylesheet's own tokens (`--bg`, `--vp`, `--yen`), so the installed icon and
     the running app are the same object.

     `web/scripts/mkicons.mjs` rasterizes this to the PNGs the manifest names.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0d1013"/>
  <g>
    <rect x="35.0" y="113.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.92"/>
    <rect x="149.0" y="113.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.92"/>
    <rect x="263.0" y="113.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.92"/>
    <rect x="377.0" y="113.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.92"/>
    <rect x="92.0" y="213.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.78"/>
    <rect x="206.0" y="213.0" width="100.0" height="86.0" rx="14.0" fill="#ffd75f" fill-opacity="1"/>
    <rect x="320.0" y="213.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.78"/>
    <rect x="149.0" y="313.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.62"/>
    <rect x="263.0" y="313.0" width="100.0" height="86.0" rx="14.0" fill="#5fa8ff" fill-opacity="0.62"/>
  </g>
</svg>
