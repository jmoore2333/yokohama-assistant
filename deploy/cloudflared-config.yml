# bdvc-nas -- locally-managed Cloudflare tunnel for services on this NAS.
#
# Locally managed means THIS FILE is the source of truth for ingress. The Zero
# Trust dashboard will show this tunnel's routes as read-only; do not try to add
# hostnames there, add them here.
#
# ADDING A SERVICE (the whole recipe):
#   1. put the service's container on the `cf-internal` docker network
#   2. add an ingress block below, above the catch-all
#   3. create a proxied CNAME  <name>.moore.nyc -> 6a6c468e-5e1e-4a7c-88a6-4e2fe07da1fc.cfargotunnel.com
#   4. create a Cloudflare Access application for that hostname -- or add
#      the hostname as a DESTINATION on an existing one, which is what the
#      `yokohama` application does for all three names it carries (only two of
#      them are routed here: `yokohama.moore.nyc` is held for the Worker)
#   5. `docker restart cloudflared-nas`
#
# Steps 3 and 4 are not optional. Ingress alone routes nothing (no DNS) and
# protects nothing (no Access).
#
# Step 1 said `cf-edge` until 2026-09-01 and the deployment never matched it:
# `cloudflared-nas` joins BOTH `cf-edge` and `cf-internal`, and every service it
# actually serves sits on `cf-internal`. Corrected to the network that works.

tunnel: 6a6c468e-5e1e-4a7c-88a6-4e2fe07da1fc
credentials-file: /etc/cloudflared/6a6c468e-5e1e-4a7c-88a6-4e2fe07da1fc.json

# Prometheus/readiness endpoint on the container network only.
metrics: 0.0.0.0:2000

originRequest:
  # Origins here are containers a hop away, so a 30s connect timeout only
  # delays discovering that one is down.
  connectTimeout: 10s
  keepAliveTimeout: 90s

ingress:
  # --- Yokohama: the BROWSER CLIENT ---------------------------------------
  # The web frontend: the same engine and the same legal-move gate the
  # terminal uses, drawn in a browser. It served `yokohama.moore.nyc` from
  # 2026-09-01 -- taking that hostname from ttyd, which is why the terminal
  # moved to the block below -- until 2026-09-21, when M6.5b2 moved it here.
  #
  # WHY THE MOVE: `yokohama.moore.nyc` is HELD FOR THE WORKER. M6.5c puts
  # hosted multiplayer in Durable Objects behind that name, and the NAS goes on
  # being the self-host path under this one, consistent with
  # `yokohama-cli.moore.nyc` below. Browser storage is per ORIGIN, so local
  # single-player games did NOT travel across the move; nothing of consequence
  # was stored (owner, R-6.5b2.5).
  #
  # PROTECTED BY: the Cloudflare Access application named `yokohama`, which
  # carries this hostname as one of its THREE destinations
  # (`yokohama.moore.nyc`, `yokohama-cli.moore.nyc`, `yokohama-nas.moore.nyc`)
  # under ONE audience and the owner's two email allow-list policies. It is
  # HOSTNAME-WIDE: every path here is behind it, `/api/health` and the client
  # bundle included. That is load-bearing and not decorative. Since M6.1 the
  # origin reads an identity -- one header, named by `YOKOHAMA_WEB_IDENTITY`,
  # required on every `/api/games` route -- and it runs `cf-access`
  # (M6.5c2, R-6.5c2.5; the NAS moved to it at that cycle's close, 2026-09-28,
  # and `deploy/RUNBOOK.md` §3 records the value each deployment runs): it reads
  # `Cf-Access-Authenticated-User-Email`, which Access sets on the requests it
  # forwards, so Access is this origin's door AND its identity. That header is
  # worth what the path to the port is worth: the origin does not verify
  # Access's signed assertion, so anything that reached port 8080 without
  # passing Access could send the header and be anyone. This tunnel is the one
  # path to the container's port 8080, which is published nowhere; that is the
  # other half of why the arrangement holds.
  #
  # M6.5b2's spec (§3.2) designs a PATH-SCOPED application instead -- one
  # application, six destinations (its own heading says FIVE and then lists
  # six; this follows the list), the public paths open -- so that a browser
  # playing only single player never meets the door. That is NOT deployed: the
  # owner ruled on 2026-09-21 that the root-domain policy stays through
  # development. Nothing in the app knows the difference, which is the point of
  # R-6.5b2.2.
  #
  # SINCE M6.3 THIS HOSTNAME CARRIES A LONG-LIVED STREAM. The browser client
  # holds one server-sent-event connection per visible tab on
  # `/api/games/<id>/stream` (and one on `/api/stream`) instead of polling, and
  # what keeps it alive through the edge is the SERVER's 25s comment heartbeat,
  # under the same ~100s idle close the ttyd block below names. Nothing here
  # configures that: `keepAliveTimeout` in `originRequest` above is the
  # cloudflared-to-origin connection POOL's idle timeout, not this stream's, so
  # raising it would not save a silent stream. MEASURED through this tunnel on
  # 2026-09-16 (`deploy/RUNBOOK.md` §3.9): with the heartbeat, a stream held ten
  # minutes -- 23 comments at 25s -- and a move made at minute nine arrived on
  # it in under a second; with the heartbeat disabled in a throwaway build, the
  # idle stream was reset at 125s. If that 25s constant ever moves, it moves
  # against this number.
  - hostname: yokohama-nas.moore.nyc
    service: http://yokohama-web:8080

  # --- Yokohama: the CLI, in a browser terminal ---------------------------
  # ttyd, WebSocket. Cloudflare closes idle sockets at 100s and ttyd pings
  # every 30s, so a game left thinking stays connected.
  #
  # The image behind this (`yokohama-terminal:0.4.0-beta.1`) is stale and is
  # due a rebuild from the current CLI -- owner, 2026-09-01.
  - hostname: yokohama-cli.moore.nyc
    service: http://yokohama-terminal:7681

  # `yokohama.moore.nyc` HAS NO BLOCK HERE, and that is deliberate (2026-09-21,
  # M6.5b2): the name is HELD FOR THE WORKER. Its DNS record still points at
  # this tunnel, so a request for it reaches cloudflared and falls through to
  # the catch-all 404 below. Do not add it back without deciding what owns it.

  # --- add new services above this line -----------------------------------
  # - hostname: foo.moore.nyc
  #   service: http://foo:8080

  # Anything not matched above gets a 404 rather than reaching a service.
  - service: http_status:404
